name: Test (PR)
run-name: ${{ github.event.client_payload.pr_title }} (#${{ github.event.client_payload.pr_number }})

on:
  repository_dispatch:
    types: [ web-pull_request ]

# Declare default permissions as readonly.
permissions:
  contents: read

env:
  repository: 'voicemeet/voicemeet'
  main-path: 'main'
  source-path: 'voicemeet'

jobs:
  get-flutter-version:
    name: Get flutter version
    runs-on: ubuntu-22.04
    outputs:
      flutter_channel: ${{ steps.flutter_version_step.outputs.flutter_channel }}
      flutter_version: ${{ steps.flutter_version_step.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Set flutter version
        id: flutter_version_step
        run: |
          flutter_channel=$(sed -n -E "s/.*flutter-channel:\ '(.*)'/\1/p" .github/workflows/release.yml|head -n1)
          flutter_version=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml|head -n1)
          echo "flutter_channel: $flutter_channel, flutter_version: $flutter_version."

          echo "flutter_channel=$flutter_channel" >> $GITHUB_OUTPUT
          echo "flutter_version=$flutter_version" >> $GITHUB_OUTPUT
        working-directory: ${{ env.source-path }}

  apk:
    name: Create apk
    runs-on: ubuntu-22.04
    needs:
      - get-flutter-version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - uses: actions/setup-java@v6
        with:
          java-version: "17.x"
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.get-flutter-version.outputs.flutter_channel }}
          flutter-version: ${{ needs.get-flutter-version.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Install Deps
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Build Apk
        run: flutter build apk --debug --no-tree-shake-icons --flavor staging --obfuscate --split-debug-info=./symbols-directory-apk
        working-directory: ${{ env.source-path }}

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-directory-apk
          path: ./${{ env.source-path }}/symbols-directory-apk

  ios:
    name: Create ios
    runs-on: macos-26
    needs:
      - get-flutter-version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.get-flutter-version.outputs.flutter_channel }}
          flutter-version: ${{ needs.get-flutter-version.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Resolving flutter dependencies
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Build Ipa
        run: flutter build ipa --no-codesign --obfuscate --split-debug-info=./symbols-directory-ipa
        working-directory: ${{ env.source-path }}

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-directory-ipa
          path: ./${{ env.source-path }}/symbols-directory-ipa

  macos:
    name: Create macos
    runs-on: macos-26
    needs:
      - get-flutter-version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.get-flutter-version.outputs.flutter_channel }}
          flutter-version: ${{ needs.get-flutter-version.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Resolving flutter dependencies
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Build macOS
        run: flutter build macos --obfuscate --split-debug-info=./symbols-directory-macos
        working-directory: ${{ env.source-path }}

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-directory-macos
          path: ./${{ env.source-path }}/symbols-directory-macos

  windows:
    name: Create windows
    runs-on: windows-2025
    needs:
      - get-flutter-version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.get-flutter-version.outputs.flutter_channel }}
          flutter-version: ${{ needs.get-flutter-version.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Install fastforge
        run: dart pub global activate fastforge
        working-directory: ${{ env.source-path }}

      - name: Install flutter dependencies
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Build flutter
        run: |
          $env:SENTRY_NATIVE_BACKEND = "breakpad"
          flutter build windows --obfuscate --split-debug-info=.\symbols-directory-windows
        working-directory: ${{ env.source-path }}

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-directory-windows
          path: .\${{ env.source-path }}\symbols-directory-windows

  web:
    name: Create web
    runs-on: ubuntu-22.04
    needs:
      - get-flutter-version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Install dependencies for Linux
        run: |
          # https://github.com/getsentry/sentry-dart/issues/2504
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo apt-get install -y curl libcurl4-openssl-dev git unzip xz-utils zip libglu1-mesa
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.get-flutter-version.outputs.flutter_channel }}
          flutter-version: ${{ needs.get-flutter-version.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Install flutter dependencies
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Build flutter
        run: flutter build web
        working-directory: ${{ env.source-path }}
